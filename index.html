<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Κρυφές Μάχες</title>
<!-- Η γραμματοσειρά έρχεται από το hub (Comfortaa). Κανένα CDN, κανένα Google Fonts (GAME-STANDARD §4). -->
<link rel="stylesheet" href="/static/fonts/comfortaa.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* Layout: full-bleed canvas city; storybook panels dock over it; HUD buttons hug the safe-area corners. One committed dusk look. */
:root{
  --ink:#1b1430; --night:#271d45; --panel:#33285a; --panel2:#43356f;
  --paper:#fff4dc; --muted:#c9bde6; --gold:#ffc94a; --rose:#ff7aa8; --mint:#6fe3c1; --danger:#ff6b5e;
  --font:'Comfortaa','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--ink)}
button{font-family:var(--font);font-weight:700;cursor:pointer;color:var(--ink);background:var(--gold);border:0;border-radius:14px;
  padding:12px 18px;font-size:18px;box-shadow:0 4px 0 #b8862a;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8862a}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
button.ghost{background:var(--panel2);color:var(--paper);box-shadow:0 4px 0 #20183c}
button.danger{background:var(--danger);color:#fff;box-shadow:0 4px 0 #a53a32}
button:disabled{opacity:.45;cursor:default}
/* always-visible shell buttons */
#shell{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:30}
#shell button{width:52px;height:52px;padding:0;font-size:24px;border-radius:50%;background:rgba(39,29,69,.82);color:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.35)}
/* screens */
#screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(70px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow:auto}
#screen.dim{background:rgba(20,14,38,.72)}
.card{background:var(--panel);border-radius:22px;padding:24px;box-shadow:0 10px 0 rgba(0,0,0,.25);max-width:900px;width:100%;box-sizing:border-box}
.title{font-size:clamp(44px,9vw,96px);font-weight:700;line-height:.95;margin:0;text-align:center;color:var(--gold);
  text-shadow:0 5px 0 #8a3b6b,0 10px 24px rgba(0,0,0,.5);letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);text-align:center;font-size:18px;margin:14px auto 26px;max-width:34em;line-height:1.5}
h2{margin:0 0 14px;font-size:28px;color:var(--gold);text-wrap:balance}
p{line-height:1.55;font-size:18px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.slot{background:var(--panel2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;min-width:0}
.slot canvas{width:120px;height:120px;border-radius:50%;background:var(--night)}
.slot .nm{font-size:22px;font-weight:700}
.slot .pg{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.pick button{background:var(--panel2);color:var(--paper);box-shadow:0 5px 0 #1e1638;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px}
.pick button.on{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #b8862a}
.pick canvas{width:150px;height:170px;max-width:100%}
label.f{display:block;font-size:18px;margin-bottom:8px;color:var(--muted)}
input#heroName{font-family:var(--font);font-size:24px;font-weight:700;width:100%;box-sizing:border-box;border-radius:14px;border:3px solid var(--panel2);
  background:var(--night);color:var(--paper);padding:12px 14px;-webkit-user-select:text;user-select:text}
input#heroName:focus{outline:none;border-color:var(--gold)}
/* wardrobe */
#house{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:minmax(260px,38%) 1fr;gap:14px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(70px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(circle at 30% 20%,#4a3466 0,#2b2048 55%,#1b1430 100%)}
.mirrorBox{background:linear-gradient(#6b4a2b,#4a321d);border-radius:120px 120px 22px 22px;padding:14px;display:flex;flex-direction:column;min-height:0}
.mirrorBox .glass{flex:1;min-height:0;border-radius:110px 110px 12px 12px;background:radial-gradient(circle at 50% 35%,#cfe9ff 0,#8fb4d9 60%,#6a8fb8 100%);overflow:hidden;position:relative}
#mirror{position:absolute;inset:0;width:100%;height:100%}
.mstats{color:#ffe9c4;font-size:15px;line-height:1.5;padding:10px 6px 0;font-variant-numeric:tabular-nums}
.ward{display:flex;flex-direction:column;min-height:0;min-width:0;gap:10px}
.whead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.whead h2{margin:0}
.whead .pg{color:var(--muted);font-size:16px}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;flex-shrink:0;scrollbar-width:thin}
.tabs button{background:var(--panel2);color:var(--paper);box-shadow:0 4px 0 #1e1638;font-size:17px;white-space:nowrap;padding:10px 14px}
.tabs button.on{background:var(--rose);color:var(--ink);box-shadow:0 4px 0 #b44a73}
.chips button{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--panel2);font-size:15px;padding:7px 12px;white-space:nowrap;border-radius:999px}
.chips button.on{border-color:var(--gold);color:var(--gold)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;align-content:start;padding:4px 2px 8px}
.opt{background:var(--panel);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--paper);
  box-shadow:0 3px 0 #1e1638;font-size:13px;position:relative;min-width:0}
.opt canvas{width:76px;height:76px}
.opt .sw{width:54px;height:54px;border-radius:50%;margin:11px 0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.opt span{line-height:1.25;text-align:center;overflow-wrap:anywhere}
.opt.on{outline:3px solid var(--gold);background:var(--panel2)}
.opt.lock{opacity:.5}
.opt .lk{position:absolute;top:6px;right:8px;font-size:14px}
.opt .nw{position:absolute;top:4px;left:6px;font-size:11px;background:var(--mint);color:var(--ink);border-radius:8px;padding:2px 5px}
.wbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
.hint{color:var(--muted);font-size:15px;min-height:1.3em}
@media (max-width:760px){
  #house{grid-template-columns:1fr;grid-template-rows:38% 1fr}
  .mirrorBox{border-radius:60px 60px 16px 16px;flex-direction:row;gap:10px}
  .mirrorBox .glass{border-radius:50px 50px 10px 10px}
  .mstats{width:40%;font-size:13px;padding:0}
}
/* touch controls */
#touch{position:fixed;inset:0;z-index:10;pointer-events:none}
#stick{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:150px;height:150px;border-radius:50%;
  background:rgba(255,244,220,.13);border:3px solid rgba(255,244,220,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,201,74,.75)}
#pads{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;
  grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,72px);gap:10px;pointer-events:auto}
#pads button{width:72px;height:72px;padding:0;border-radius:50%;font-size:28px;background:rgba(51,40,90,.85);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.4);position:relative;overflow:hidden;touch-action:none}
#pads button .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
#pads button.ready{background:rgba(255,122,168,.9)}
#pads button.use{background:rgba(111,227,193,.9);color:var(--ink)}
#pads button:disabled{opacity:.35}
#rotate{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;font-size:22px;padding:24px}
#rotate .ph{font-size:72px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none}button{transition:none}}
.toastline{font-size:15px;color:var(--muted);text-align:center;margin-top:12px}
.endnames{font-size:20px;line-height:1.7;text-align:center}
</style>
</head>
<body>

<canvas id="game" aria-label="Κρυφές Μάχες"></canvas>
<div id="touch" hidden>
  <div id="stick"><div id="knob"></div></div>
  <div id="pads">
    <button id="pA" aria-label="Ικανότητα 1">⚡<span class="cd"></span></button>
    <button id="pB" aria-label="Ικανότητα 2">💨<span class="cd"></span></button>
    <button id="pS" aria-label="Σούπερ">★<span class="cd"></span></button>
    <button id="pC" aria-label="Ασπίδα">🛡<span class="cd"></span></button>
    <button id="pF" aria-label="Φαγητό">🥧<span class="cd"></span></button>
    <button id="pE" aria-label="Μπες">👆<span class="cd"></span></button>
  </div>
</div>
<div id="screen" hidden></div>
<div id="house" hidden>
  <div class="mirrorBox"><div class="glass"><canvas id="mirror"></canvas></div><div class="mstats" id="mstats"></div></div>
  <div class="ward">
    <div class="whead"><h2 id="wTitle">Το σπίτι μου</h2><span class="pg" id="wProg"></span></div>
    <div class="tabs" id="wTabs"></div>
    <div class="chips" id="wChips"></div>
    <div class="hint" id="wHint"></div>
    <div class="grid" id="wGrid"></div>
    <div class="wbar">
      <button class="ghost" id="wRandom">🎲 Τυχαίο</button>
      <button class="ghost" id="wSave">💾 Αποθήκευση</button>
      <button id="wOut">🚪 Βγες στην πόλη</button>
    </div>
  </div>
</div>
<div id="shell">
  <button id="bPause" aria-label="Παύση">⏸</button>
  <button id="bSound" aria-label="Ήχος">🔊</button>
  <button id="bFull" aria-label="Πλήρης οθόνη">⛶</button>
  <button id="bHome" aria-label="Πίσω στα παιχνίδια">🏠</button>
</div>
<div id="rotate" hidden><div class="ph">📱</div><div>Γύρισε τη συσκευή οριζόντια για να παίξεις!</div></div>
<script>
'use strict';
/* ============================================================
   Κρυφές Μάχες v1 — household game (GAME-STANDARD v1)
   ============================================================ */
const CONFIG = {
  slug: 'kryfes-maches',
  hubPath: '/kryfes-maches',      // when served from the hub, 🏠 goes to '/'
  serverSave: false,              // level B saves: enabled later by the hub
  heroHp: 100,
  heroSpeed: 175,                 // world units per second while exploring
  fightSpeed: 160,
  exploreHeroScreen: 0.20,        // hero height as share of screen height
  fightHeroScreen: 0.13,
  bossBaseHp: 1500,
  bossMinSeconds: 95,             // boss hp never lower than est. dps * this
  miniHp: 45,
  foodHeal: 35,
  foodMax: 3,
  foodRespawn: 45,
  revealBoss: 170,
  revealMini: 120,
  regenOutOfFight: 4,
  superCharge: 100,
};
const SAVE_KEY = 'game.' + CONFIG.slug + '.v1';
const SOUND_KEY = 'game.' + CONFIG.slug + '.sound';
const SCHEMA = 1;

/* ---------- small utils ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function seeded(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function star(c, x, y, r1, r2, n) { c.beginPath(); for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / n; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.closePath(); }
function heart(c, x, y, s) { c.beginPath(); c.moveTo(x, y + s * .35); c.bezierCurveTo(x - s, y - s * .35, x - s * .45, y - s, x, y - s * .45); c.bezierCurveTo(x + s * .45, y - s, x + s, y - s * .35, x, y + s * .35); c.closePath(); }
function shade(hex, f) { // f>0 lighter, f<0 darker
  if (!hex || hex[0] !== '#') return hex;
  let n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f > 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; } else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return '#' + ((1 << 24) + (Math.round(r) << 16) + (Math.round(g) << 8) + Math.round(b)).toString(16).slice(1);
}

/* ---------- palettes ---------- */
const SKIN = ['#ffe3cc', '#f6c9a3', '#eab386', '#d89b6b', '#bf7f52', '#9e623c', '#7c472a', '#5b331e'];
const HAIRC = ['#231b17', '#4a2e1d', '#7b4a2a', '#b5762f', '#e3b04b', '#f4dc8a', '#c94a2b', '#a8aeb6', '#fbfbf7', '#ff7ab6', '#5aa8ff', '#9b6bff', '#3fcf8e', 'rainbow'];
const EYEC = ['#3b2a1e', '#6b4a2b', '#2f6db5', '#3e8e5a', '#7a8a99', '#8a5cc8', '#d4a017'];
const CLOTH = ['#e8434b', '#ff8a3d', '#ffd23f', '#5cc96b', '#2fb8a6', '#3a86ff', '#5b5fd8', '#a05cd6', '#ff6fb1', '#f5f1e8', '#3a3a48', '#8a5a3b', '#1f6b4a', '#b8e0ff'];
const BLUSH = ['#ff8fa3', '#ff6f6f', '#f7a1c4', '#e07a5f'];
const EYESH = ['#9b6bff', '#3a86ff', '#2fb8a6', '#ffd23f', '#ff6fb1', '#c0c0c8'];
const LIPS = ['#e23d5a', '#ff6fb1', '#b5446e', '#ff8a3d', '#8a3ffc', '#c96b5a'];

/* ---------- wardrobe catalogue ----------
   unlock = number of won battles needed (0..20). Power items: weapon, armor. */
const colorOpts = (pal, unlocks) => pal.map((c, i) => ({ id: 'c' + i, label: '', color: c, unlock: unlocks ? unlocks[i] || 0 : 0 }));
const makeupOpts = (pal, start) => [{ id: 'none', label: 'Τίποτα', unlock: 0 }].concat(pal.map((c, i) => ({ id: 'c' + i, label: '', color: c, unlock: i < 2 ? start : start + i })));
const CAT = {
  skin: { label: 'Δέρμα', view: 'color', opts: colorOpts(SKIN) },
  eyes: { label: 'Μάτια', view: 'color', opts: colorOpts(EYEC, [0, 0, 0, 0, 2, 4, 7]) },
  freckles: { label: 'Φακίδες', view: 'head', opts: [{ id: 'none', label: 'Χωρίς', unlock: 0 }, { id: 'few', label: 'Λίγες', unlock: 0 }, { id: 'many', label: 'Πολλές', unlock: 0 }] },
  blush: { label: 'Ρουζ', view: 'head', opts: makeupOpts(BLUSH, 0) },
  eyeshadow: { label: 'Σκιά ματιών', view: 'head', opts: makeupOpts(EYESH, 0) },
  lips: { label: 'Κραγιόν', view: 'head', opts: makeupOpts(LIPS, 0) },
  facepaint: { label: 'Ζωγραφιά', view: 'head', opts: [
    { id: 'none', label: 'Τίποτα', unlock: 0 }, { id: 'stars', label: 'Αστεράκια', unlock: 0 }, { id: 'heart', label: 'Καρδούλα', unlock: 1 },
    { id: 'tiger', label: 'Τίγρης', unlock: 3 }, { id: 'bolt', label: 'Κεραυνός', unlock: 5 }, { id: 'whiskers', label: 'Μουστάκια γάτας', unlock: 7 },
    { id: 'rainbow', label: 'Ουράνιο τόξο', unlock: 9 }, { id: 'scales', label: 'Λέπια δράκου', unlock: 13 }] },
  mask: { label: 'Μάσκα', view: 'head', opts: [
    { id: 'none', label: 'Χωρίς', unlock: 0 }, { id: 'hero', label: 'Ηρωική', unlock: 0 }, { id: 'ninja', label: 'Νίντζα', unlock: 2 },
    { id: 'carnival', label: 'Καρναβάλι', unlock: 4 }, { id: 'fox', label: 'Αλεπού', unlock: 6 }, { id: 'butterfly', label: 'Πεταλούδα', unlock: 8 },
    { id: 'knight', label: 'Ιππότη', unlock: 11 }, { id: 'dragon', label: 'Δράκου', unlock: 16 }] },
  hair: { label: 'Χτένισμα', view: 'head', opts: [
    { id: 'short', label: 'Κοντά', unlock: 0 }, { id: 'long', label: 'Μακριά', unlock: 0 }, { id: 'pony', label: 'Αλογοουρά', unlock: 0 },
    { id: 'braids', label: 'Κοτσίδες', unlock: 0 }, { id: 'curly', label: 'Σγουρά', unlock: 0 }, { id: 'bun', label: 'Κότσος', unlock: 1 },
    { id: 'bob', label: 'Καρέ', unlock: 2 }, { id: 'pigtails', label: 'Δύο κοτσιδάκια', unlock: 3 }, { id: 'spiky', label: 'Σηκωτά', unlock: 4 },
    { id: 'mohawk', label: 'Λοφίο', unlock: 6 }, { id: 'buzz', label: 'Ξυρισμένα', unlock: 0 }] },
  hairColor: { label: 'Χρώμα μαλλιών', view: 'color', opts: colorOpts(HAIRC, [0, 0, 0, 0, 0, 0, 0, 0, 1, 2, 3, 4, 5, 10]) },
  hat: { label: 'Καπέλο', view: 'head', opts: [
    { id: 'none', label: 'Χωρίς', unlock: 0 }, { id: 'band', label: 'Κορδέλα', unlock: 0 }, { id: 'cap', label: 'Τζόκεϊ', unlock: 0 },
    { id: 'flowers', label: 'Στεφάνι λουλούδια', unlock: 1 }, { id: 'tiara', label: 'Τιάρα', unlock: 3 }, { id: 'helmet', label: 'Κράνος', unlock: 5 },
    { id: 'wizard', label: 'Μάγου', unlock: 7 }, { id: 'horns', label: 'Κερατάκια', unlock: 10 }, { id: 'crown', label: 'Στέμμα', unlock: 14 }] },
  earrings: { label: 'Σκουλαρίκια', view: 'head', opts: [
    { id: 'none', label: 'Χωρίς', unlock: 0 }, { id: 'studs', label: 'Μικρά', unlock: 0 }, { id: 'hoops', label: 'Κρίκοι', unlock: 1 },
    { id: 'stars', label: 'Αστέρια', unlock: 4 }, { id: 'moons', label: 'Φεγγάρια', unlock: 8 }, { id: 'drops', label: 'Κρύσταλλα', unlock: 12 }] },
  top: { label: 'Μπλούζα', view: 'body', opts: [
    { id: 'tshirt', label: 'Μπλουζάκι', unlock: 0 }, { id: 'hoodie', label: 'Φούτερ', unlock: 0 }, { id: 'tunic', label: 'Χιτώνας', unlock: 0 },
    { id: 'dress', label: 'Φόρεμα', unlock: 0 }, { id: 'vest', label: 'Γιλέκο', unlock: 2 }, { id: 'sailor', label: 'Ναυτικό', unlock: 4 },
    { id: 'kimono', label: 'Κιμονό', unlock: 6 }] },
  topColor: { label: 'Χρώμα μπλούζας', view: 'color', opts: colorOpts(CLOTH) },
  pattern: { label: 'Σχέδιο', view: 'body', opts: [
    { id: 'plain', label: 'Απλό', unlock: 0 }, { id: 'stripes', label: 'Ρίγες', unlock: 0 }, { id: 'dots', label: 'Πουά', unlock: 0 },
    { id: 'stars', label: 'Αστέρια', unlock: 1 }, { id: 'hearts', label: 'Καρδιές', unlock: 2 }, { id: 'checks', label: 'Καρό', unlock: 3 },

  const d = Store.read(); G.S.saved = Date.now(); d.slots[G.slot] = JSON.parse(JSON.stringify(G.S));
  const ok = Store.write(d);
  if (showToast) toast(ok ? 'Αποθηκεύτηκε ✓' : 'Αποθηκεύτηκε μόνο για τώρα (η συσκευή δεν κρατά αποθήκευση)');
  return ok;
}
function toast(text, col) { G.toasts.push({ text, t: 0, dur: 3.2, col: col || '#fff4dc' }); if (G.toasts.length > 4) G.toasts.shift(); }

function heroInit() {
  G.hero = { x: HOME.spawn.x, y: HOME.spawn.y, face: 1, moving: false, t: 0, hp: CONFIG.heroHp, max: CONFIG.heroHp, atkT: 0, atk: 0,
    cd: { a: 0, b: 0, c: 0 }, shield: 0, superC: 0, dash: 0, dvx: 0, dvy: 0, inv: 0, hurt: 0, fall: 0, spin: 0, expr: 'happy', exprT: 0, dashHit: new Set() };
}

function populateCity() {
  const S = G.S;
  G.monsters = []; G.proj = []; G.fx = []; G.tele = []; G.fight = null;
  BOSSES.forEach(b => { if (!S.bosses.includes(b.id)) G.monsters.push({ ...b, def: b, hidden: true, seed: Math.random() * 9, state: 'hidden' }); });
  MINI_SPOTS.forEach((p, i) => { const id = 'm' + i; if (!S.minis.includes(id)) G.monsters.push({ id, kind: 'mini', name: 'Τα Σκιουλάκια', x: p[0], y: p[1], ax: p[0], ay: p[1], ar: 165, size: 42, hidden: true, seed: Math.random() * 9, state: 'hidden', group: true }); });
  if (!G.foods.length) G.foods = FOOD_SPOTS.map(f => ({ x: f[0], y: f[1], kind: f[2], ready: true, t: 0 }));
  G.portal = S.bosses.length >= 5 && !S.finished ? portalSpot() : null;
  if (!G.npcs.length) spawnLife();
}
function portalSpot() { const p = PORTAL_SPOTS[G.S.seed % PORTAL_SPOTS.length]; return { x: p[0], y: p[1] }; }

/* ---------- ambient life ---------- */
function randomLook(R) {
  const L = defaultLook(R() < .5 ? 'girl' : 'boy');
  ['skin', 'hair', 'hairColor', 'top', 'topColor', 'bottom', 'bottomColor', 'shoeColor'].forEach(k => { const o = CAT[k].opts.filter(x => x.unlock <= 2 && x.color !== 'rainbow'); L[k] = o[Math.floor(R() * o.length)].id; });
  if (R() < .2) L.hat = 'cap'; L.weapon = null; return L;
}
const WALK_RECTS = ROADS.concat([PROMENADE, PLAZA]);
function roadPoint(r) { r = r || pick(WALK_RECTS); return { x: r.x + 8 + Math.random() * (r.w - 16), y: r.y + 8 + Math.random() * (r.h - 16) }; }
function grassPoint(cx, cy, rad) { for (let i = 0; i < 20; i++) { const x = cx + rnd(-rad, rad), y = cy + rnd(-rad, rad); if (!blocked(x, y, 10)) return { x, y }; } return { x: cx, y: cy }; }
function lakePoint() { for (let i = 0; i < 30; i++) { const x = LAKE.x + rnd(-LAKE.rx, LAKE.rx), y = LAKE.y + rnd(-LAKE.ry, LAKE.ry); if (inLake(x, y, 40) && dist(x, y, ISLAND.x, ISLAND.y) > ISLAND.r + 50) return { x, y }; } return { x: LAKE.x, y: LAKE.y + 400 }; }
const LANES = [
  { ax: 'h', c: 980, a: 200, b: 2030, d: 1 }, { ax: 'h', c: 1010, a: 200, b: 2030, d: -1 }, { ax: 'h', c: 1580, a: 200, b: 2000, d: 1 }, { ax: 'h', c: 1610, a: 200, b: 2000, d: -1 },
  { ax: 'v', c: 880, a: 560, b: 2150, d: 1 }, { ax: 'v', c: 910, a: 560, b: 2150, d: -1 }, { ax: 'v', c: 1660, a: 640, b: 2150, d: 1 }, { ax: 'v', c: 1690, a: 640, b: 2150, d: -1 },
];
const CAR_COLS = ['#e8434b', '#3a86ff', '#ffd23f', '#5cc96b', '#f5f1e8', '#a05cd6', '#ff8a3d'];
function spawnLife() {
  const R = Math.random;
  G.npcs = []; for (let i = 0; i < 18; i++) { const wr = pick(WALK_RECTS), p = roadPoint(wr); G.npcs.push({ wr, x: p.x, y: p.y, tx: p.x, ty: p.y, look: randomLook(R), sp: rnd(28, 48), t: R() * 9, face: 1, wait: R() * 3, s: rnd(.62, .78) }); }
  G.cars = LANES.map((l, i) => ({ lane: l, p: l.a + R() * (l.b - l.a), sp: rnd(70, 105), col: CAR_COLS[i % CAR_COLS.length] }));
  G.animals = [];
  [[700, 1300], [1150, 1150], [520, 1820], [1450, 2050], [2600, 760], [380, 600]].forEach((p, i) => { const q = grassPoint(p[0], p[1], 90); G.animals.push({ kind: i % 2 ? 'dog' : 'cat', x: q.x, y: q.y, hx: p[0], hy: p[1], tx: q.x, ty: q.y, wait: 0, t: R() * 9, face: 1, col: pick(['#f2a65a', '#3a3a48', '#e9e1d4', '#8a5a3b']) }); });
  for (let i = 0; i < 8; i++) { const q = lakePoint(); G.animals.push({ kind: 'duck', x: q.x, y: q.y, tx: q.x, ty: q.y, wait: 0, t: R() * 9, face: 1 }); }
}
function updateLife(dt) {
  const h = G.hero;
  G.npcs.forEach(n => {
    n.t += dt; if (n.wait > 0) { n.wait -= dt; n.moving = false; return; }
    const d = dist(n.x, n.y, n.tx, n.ty); if (d < 4) { const p = roadPoint(n.wr); n.tx = p.x; n.ty = p.y; n.wait = rnd(.5, 4); return; }
    n.x += (n.tx - n.x) / d * n.sp * dt; n.y += (n.ty - n.y) / d * n.sp * dt; n.face = n.tx > n.x ? 1 : -1; n.moving = true;
  });
  G.cars.forEach(car => {
    const l = car.lane, x = l.ax === 'h' ? car.p : l.c, y = l.ax === 'h' ? l.c : car.p;
    const ahead = l.ax === 'h' ? (h.x - x) * l.d : (h.y - y) * l.d, side = l.ax === 'h' ? Math.abs(h.y - y) : Math.abs(h.x - x);
    let stop = ahead > 0 && ahead < 90 && side < 40;
    if (G.fight && dist(x, y, G.fight.cx, G.fight.cy) < G.fight.r + 50) stop = true;
    car.v = lerp(car.v || 0, stop ? 0 : car.sp, dt * 3); car.p += car.v * l.d * dt;
    if (car.p > l.b + 40) car.p = l.a - 40; if (car.p < l.a - 40) car.p = l.b + 40;
  });
  G.animals.forEach(a => {
    a.t += dt; if (a.wait > 0) { a.wait -= dt; a.moving = false; return; }
    const d = dist(a.x, a.y, a.tx, a.ty);
    if (d < 4) { const q = a.kind === 'duck' ? lakePoint() : grassPoint(a.hx, a.hy, 110); a.tx = q.x; a.ty = q.y; a.wait = rnd(1, 5); return; }
    const sp = a.kind === 'duck' ? 18 : a.kind === 'dog' ? 55 : 40;
    const nx = a.x + (a.tx - a.x) / d * sp * dt, ny = a.y + (a.ty - a.y) / d * sp * dt;
    if (a.kind === 'duck' && (!inLake(nx, ny, 20) || dist(nx, ny, ISLAND.x, ISLAND.y) < ISLAND.r + 30)) { a.tx = a.x; a.ty = a.y; return; }
    a.x = nx; a.y = ny; a.face = a.tx > a.x ? 1 : -1; a.moving = true;
  });
}

/* ---------- combat helpers ---------- */
function estDps(w) { return w.dmg * w.rate * 1.35; }
function arenaClamp(o, pad) { const f = G.fight; if (!f) return; const d = dist(o.x, o.y, f.cx, f.cy), m = f.r - pad; if (d > m) { o.x = f.cx + (o.x - f.cx) / d * m; o.y = f.cy + (o.y - f.cy) / d * m; } }
function liveEnemies() { return G.fight ? G.fight.enemies.filter(e => !e.dead && !e.dying) : []; }
function nearestEnemy(x, y) { let best = null, bd = 1e9; liveEnemies().forEach(e => { const d = dist(x, y, e.x, e.y - e.size * .3); if (d < bd) { bd = d; best = e; } }); return best; }
function fx(kind, x, y, o) { G.fx.push(Object.assign({ kind, x, y, t: 0, dur: .6, vx: 0, vy: 0 }, o || {})); }
function sparkBurst(x, y, n, cols, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = rnd(.3, 1) * (sp || 260); fx('spark', x, y, { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, dur: rnd(.5, 1.1), col: pick(cols || RAINBOW), r: rnd(2, 5) }); } }
function dmgText(x, y, v, col) { fx('text', x + rnd(-8, 8), y, { text: String(Math.round(v)), col: col || '#fff4dc', vy: -60, dur: .8 }); }

function startFight(m) {
  const S = G.S, w = weaponOf(S.look), k = S.bosses.length;
  m.hidden = false; m.state = 'fight';
  const f = { m, type: m.group ? 'mini' : 'boss', cx: m.ax, cy: m.ay, r: m.ar, enemies: [], t: 0, name: m.name };
  if (m.group) {
    const n = battlesWon(S) >= 8 ? 4 : 3, hp = CONFIG.miniHp * (1 + battlesWon(S) * .14);
    for (let i = 0; i < n; i++) { const a = i / n * TAU; f.enemies.push({ kind: 'mini', x: m.x + Math.cos(a) * 50, y: m.y + Math.sin(a) * 40, size: 42, hp, max: hp, seed: Math.random() * 9, shoot: rnd(1.5, 3), flash: 0, frozen: 0, state: 'fight' }); }
    G.banner = { text: 'Κρυφή μάχη! Σκιουλάκια!', t: 0, dur: 1.4 };
  } else {
    const hp = Math.max(CONFIG.bossBaseHp * (1 + .3 * k), estDps(w) * CONFIG.bossMinSeconds);
    Object.assign(m, { hp, max: hp, atkT: 2.2, atkAnim: 0, flash: 0, frozen: 0, pi: 0, queue: [], vx: 0, vy: 0, charge: 0 });
    f.enemies.push(m);
    G.banner = { text: m.intro, t: 0, dur: 2 };
  }
  G.fight = f; G.freeze = .9; arenaClamp(G.hero, 30);
  sfx('reveal'); music('fight');
}

function heroAttack(dt) {
  const h = G.hero, w = weaponOf(G.S.look);
  h.atkT -= dt; if (h.atk > 0) h.atk = Math.max(0, h.atk - dt * 4);
  const tgt = nearestEnemy(h.x, h.y - 30); if (!tgt) return;
  h.face = tgt.x >= h.x ? 1 : -1;
  const d = dist(h.x, h.y - 30, tgt.x, tgt.y - tgt.size * .3) - tgt.size * .35;
  if (h.atkT > 0 || d > w.range) return;
  h.atkT = 1 / w.rate; h.atk = 1;
  if (w.type === 'melee') {
    liveEnemies().forEach(e => { if (dist(h.x, h.y - 30, e.x, e.y - e.size * .3) - e.size * .35 <= w.range + 6) hitEnemy(e, w.dmg); });
    fx('slash', h.x + h.face * 26, h.y - 32, { dur: .25, face: h.face, col: w.c2 === '#ffffff' ? '#e8fbff' : w.c2 }); sfx('swing');
  } else {
    shootAt(h.x + h.face * 16, h.y - 36, tgt, w, w.dmg, 0); sfx(w.type === 'magic' ? 'zap' : 'shoot');
  }
}
function shootAt(x, y, tgt, w, dmg, ang) {
  const a = Math.atan2(tgt.y - tgt.size * .35 - y, tgt.x - x) + (ang || 0);
  const kind = w.shape === 'sling' ? 'stone' : w.shape === 'bow' ? 'arrow' : w.shape === 'boomerang' ? 'boomer' : 'orb';
  const sp = w.type === 'magic' ? 380 : 540;
  G.proj.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: kind === 'orb' ? 6 : 5, dmg, kind, owner: 'hero', life: 1.4, col: w.c2, homing: w.type === 'magic' ? tgt : null, pierce: kind === 'boomer', hit: new Set(), seed: Math.random() });
}
function hitEnemy(e, dmg) {
  if (e.dead || e.dying) return;
  e.hp -= dmg; e.flash = .1; dmgText(e.x, e.y - e.size * .9, dmg);
  G.hero.superC = Math.min(CONFIG.superCharge, G.hero.superC + dmg * (G.fight && G.fight.type === 'boss' ? .32 : .6));
  sfx('hit');
  if (e.hp <= 0) {
    e.hp = 0;
    if (e.kind === 'mini') { e.dead = true; sparkBurst(e.x, e.y - 20, 24, ['#c9b5ff', '#fff3a8', '#ff9bf0']); sfx('pop'); }
    else { e.dying = .001; sparkBurst(e.x, e.y - e.size * .4, 80, null, 380); sfx('bigpop'); }
  }
}
function useAbility(slot) {
  const h = G.hero; if (!h || G.mode !== 'city' || G.dead || G.cine) return;
  const w = weaponOf(G.S.look), ab = ABIL[w.type][slot === 'a' ? 0 : 1];
  if (slot === 'c') { if (h.cd.c > 0) return; h.cd.c = 12; h.shield = 2.6; sfx('shield'); return; }
  if (h.cd[slot] > 0) return; h.cd[slot] = ab.cd;
  const tgt = nearestEnemy(h.x, h.y - 30);
  switch (ab.k) {
    case 'spin': h.spin = .45; fx('ring', h.x, h.y - 25, { r: 95, dur: .45, col: '#fff3a8' }); liveEnemies().forEach(e => { if (dist(h.x, h.y, e.x, e.y) < 95 + e.size * .4) hitEnemy(e, w.dmg * 2.6); }); sfx('whoosh'); break;
    case 'dash': { let dx = Input.mx, dy = Input.my; if (!dx && !dy) { if (tgt) { dx = tgt.x - h.x; dy = tgt.y - h.y; } else dx = h.face; } const d = Math.hypot(dx, dy) || 1; h.dash = .22; h.dvx = dx / d * 780; h.dvy = dy / d * 780; h.dashHit = new Set(); sfx('whoosh'); break; }
    case 'rain': { const tx = tgt ? tgt.x : h.x + h.face * 140, ty = tgt ? tgt.y : h.y; G.tele.push({ kind: 'rain', x: tx, y: ty, r: 95, t: 0, dur: .55, friendly: true, dmg: w.dmg * 3.2 }); sfx('shoot'); break; }
    case 'fan': if (tgt) for (let i = -2; i <= 2; i++) shootAt(h.x + h.face * 14, h.y - 36, tgt, w, w.dmg * 1.2, i * .22); sfx('shoot'); break;
    case 'nova': for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; G.proj.push({ x: h.x, y: h.y - 30, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, r: 7, dmg: w.dmg * 1.3, kind: 'starbolt', owner: 'hero', life: .9, hit: new Set(), seed: Math.random() }); } sfx('zap'); break;
    case 'frost': fx('ring', h.x, h.y - 25, { r: 210, dur: .6, col: '#bff3ff' }); for (let i = 0; i < 30; i++) fx('snow', h.x + rnd(-200, 200), h.y + rnd(-160, 120), { dur: 1.2, vy: 30 }); liveEnemies().forEach(e => { if (dist(h.x, h.y, e.x, e.y) < 210 + e.size * .4) { e.frozen = 2.6; hitEnemy(e, w.dmg * 1.5); } }); sfx('frost'); break;
  }
}
function eatFood() {
  const h = G.hero; if (!h || G.mode !== 'city' || G.dead || G.cine) return;
  if (G.S.food <= 0) { toast('Δεν έχεις φαγητό. Ψάξε πίτες και κουλούρια στην πόλη!'); return; }
  if (h.hp >= h.max) { toast('Η ζωή σου είναι ήδη γεμάτη!'); return; }
  G.S.food--; h.hp = Math.min(h.max, h.hp + CONFIG.foodHeal); for (let i = 0; i < 8; i++) fx('heart', h.x + rnd(-18, 18), h.y - 40, { vy: -50, dur: 1 }); sfx('eat');
}
function useSuper() {
  const h = G.hero; if (!h || G.mode !== 'city' || G.dead || G.cine || h.superC < CONFIG.superCharge || !G.fight) return;
  h.superC = 0; sfx('super');
  G.cine = { kind: 'super', t: 0, dur: 1.15, text: upGR('Σούπερ ' + weaponOf(G.S.look).label) + '!', done: () => {
    const w = weaponOf(G.S.look); G.proj = G.proj.filter(p => p.owner === 'hero'); G.tele = G.tele.filter(t => t.friendly);
    fx('ring', h.x, h.y - 30, { r: G.fight ? G.fight.r + 40 : 300, dur: .7, col: '#fff3a8' }); sparkBurst(h.x, h.y - 40, 60, ['#fff3a8', '#ffd23f', '#ffffff']);
    liveEnemies().forEach(e => hitEnemy(e, w.dmg * 9)); G.shake = .5;
  } };
}
function heroHurt(dmg, src) {
  const h = G.hero; if (h.inv > 0 || h.shield > 0 || h.dash > 0 || G.dead) return;
  const def = armorDef(G.S.look); dmg *= (1 - .09 * def);
  h.hp -= dmg; h.inv = .75; h.hurt = .35; h.expr = 'ouch'; h.exprT = .5; G.shake = .25;
  dmgText(h.x, h.y - 70, dmg, '#ff9a8f'); sfx('hurt');
  if (h.hp <= 0) { h.hp = 0; loseFight(); }
}
function loseFight() {
  G.dead = .001; sfx('lose'); music(null);
}
function finishLose() {
  const f = G.fight, m = f && f.m;
  if (m) { m.hidden = true; m.state = 'hidden'; m.dying = 0; if (!m.group) { m.x = m.def.x; m.y = m.def.y; } }
  G.fight = null; G.proj = []; G.tele = []; G.dead = 0;
  G.hero.hp = G.hero.max; G.hero.fall = 0; G.S.food = Math.max(G.S.food, 2);
  G.paused = true; showScreen('lost', { who: m ? m.name[0].toLowerCase() + m.name.slice(1) : '' });
}
function winFight() {
  const f = G.fight, m = f.m, S = G.S;
  const before = battlesWon(S);
  if (m.group) S.minis.push(m.id); else S.bosses.push(m.id);
  const after = battlesWon(S);
  G.monsters = G.monsters.filter(x => x !== m);
  G.fight = null; G.proj = G.proj.filter(p => p.owner === 'hero'); G.tele = [];
  music('city');
  const won = m.group ? 'Νίκησες τα Σκιουλάκια!' : 'Νίκησες ' + m.acc + '!';
  G.cine = { kind: 'win', t: 0, dur: 1.9, text: won, done: () => {
    const nw = WEAPONS.find(x => x.unlock === after && x.unlock > before);
    if (nw) toast('Νέο όπλο: ' + nw.label + '! Φόρεσέ το στο σπίτι.', '#ffc94a');
    let cnt = 0; Object.keys(CAT).forEach(k => { if (k === 'weapon') return; CAT[k].opts.forEach(o => { if (o.unlock > before && o.unlock <= after) cnt++; }); });
    if (cnt) toast(cnt + (cnt === 1 ? ' νέο πράγμα' : ' νέα πράγματα') + ' στη ντουλάπα του σπιτιού!', '#6fe3c1');
    if (!m.group && S.bosses.length >= 5 && !G.portal) { G.portal = portalSpot(); toast('Η μαγική πύλη άνοιξε κάπου στην πόλη! Ψάξε τη!', '#ff9bf0'); sfx('portal'); }
    const left = 5 - S.bosses.length; if (!m.group && left > 0) toast(left === 1 ? 'Μένει 1 τέρας κρυμμένο στην πόλη.' : 'Μένουν ' + left + ' τέρατα κρυμμένα στην πόλη.');
    saveGame(false);
  } };
  sfx('win');
}

/* ---------- boss patterns ---------- */
function bossAttack(m) {
  const h = G.hero, phase = m.hp / m.max < .33 ? 2 : m.hp / m.max < .66 ? 1 : 0;
  const pat = m.def.pats[m.pi++ % m.def.pats.length];
  const ox = m.x, oy = m.y - m.size * .5, aim = Math.atan2(h.y - 30 - oy, h.x - ox);
  const dmgOf = { rock: 12, furball: 9, sun: 11, bag: 10, pie: 10 }[m.def.proj];
  const shot = (a, sp, extra) => G.proj.push(Object.assign({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: m.def.proj === 'rock' ? 9 : 11, dmg: dmgOf, kind: m.def.proj, owner: 'enemy', life: 4, seed: Math.random() }, extra || {}));
  m.atkAnim = 1;
  switch (pat) {
    case 'aimed': { const n = 3 + phase; for (let i = 0; i < n; i++) m.queue.push({ t: i * .28, fn: () => shot(Math.atan2(G.hero.y - 30 - oy, G.hero.x - ox) + rnd(-.06, .06), 270 + phase * 30) }); break; }
    case 'spread': { const n = 5 + phase * 2; for (let i = 0; i < n; i++) shot(aim + (i - (n - 1) / 2) * .2, 230); break; }
    case 'ring': { const n = 10 + phase * 3, off = Math.random(); for (let i = 0; i < n; i++) shot((i + off) / n * TAU, 190); break; }
    case 'bounce': for (let i = 0; i < 3 + phase; i++) shot(Math.random() * TAU, 230, { bounce: 2 + phase, life: 6 }); break;
    case 'charge': G.tele.push({ kind: 'line', x: m.x, y: m.y, x2: h.x, y2: h.y, w: m.size * .6, t: 0, dur: .7, then: () => { const a = Math.atan2(G.hero.y - m.y, G.hero.x - m.x); m.vx = Math.cos(a) * 560; m.vy = Math.sin(a) * 560; m.charge = .5; sfx('whoosh'); } }); break;
    case 'rain': { const n = 4 + phase * 2; for (let i = 0; i < n; i++) { const a = Math.random() * TAU, r = i === 0 ? 0 : rnd(40, 150); G.tele.push({ kind: 'sun', x: h.x + Math.cos(a) * r, y: h.y + Math.sin(a) * r * .7, r: 46, t: -i * .12, dur: 1.15, dmg: 13 }); } break; }
    case 'beam': { const a = aim; G.tele.push({ kind: 'beam', x: ox, y: oy, a, len: 520, w: 34, t: 0, dur: .85, dmg: 15 }); m.queue.push({ t: .9, fn: () => { for (let i = -1; i <= 1; i++) shot(a + i * .35, 240); } }); break; }
    case 'summon': for (let i = 0; i < 2; i++) { const hp = CONFIG.miniHp * .8; G.fight.enemies.push({ kind: 'mini', x: m.x + (i ? 60 : -60), y: m.y + 20, size: 36, hp, max: hp, seed: Math.random() * 9, shoot: 2.5, flash: 0, frozen: 0, state: 'fight' }); } sparkBurst(m.x, m.y - 30, 20, ['#c9b5ff']); break;
  }
  m.atkT = (2.15 - phase * .35) * rnd(.85, 1.15);
}

function updateFight(dt) {
  const f = G.fight; if (!f) return; f.t += dt;
  const h = G.hero;
  f.enemies.forEach(e => {
    if (e.dead) return;
    e.flash = Math.max(0, e.flash - dt); e.frozen = Math.max(0, e.frozen - dt);
    const slow = e.frozen > 0 ? .3 : 1;
    if (e.dying) { e.dying += dt; return; }
    if (e.kind === 'mini') {
      const d = dist(e.x, e.y, h.x, h.y), a = Math.atan2(h.y - e.y, h.x - e.x);
      if (d > 34) { e.x += Math.cos(a) * 78 * slow * dt; e.y += Math.sin(a) * 78 * slow * dt; }
      f.enemies.forEach(o => { if (o !== e && !o.dead && o.kind === 'mini') { const dd = dist(e.x, e.y, o.x, o.y); if (dd < 40 && dd > 0) { e.x += (e.x - o.x) / dd * 30 * dt; e.y += (e.y - o.y) / dd * 30 * dt; } } });

      return;
    }
    // boss
    e.atkAnim = Math.max(0, e.atkAnim - dt * 2.5);
    e.queue = e.queue.filter(q => { q.t -= dt; if (q.t <= 0) { q.fn(); return false; } return true; });
    if (e.charge > 0) { e.charge -= dt; e.x += e.vx * dt; e.y += e.vy * dt; arenaClamp(e, e.size * .4); }
    else if (e.def.mobile) {

      const a = Math.atan2(h.y - e.y, h.x - e.x) + Math.sin(f.t * .7) * .9, sp = (d > want ? 52 : -30) * slow;
      e.x += Math.cos(a) * sp * dt; e.y += Math.sin(a) * sp * dt; arenaClamp(e, e.size * .4);

    if (dist(e.x, e.y - e.size * .25, h.x, h.y - 25) < e.size * .42 + 12) heroHurt(e.charge > 0 ? 15 : 9);
    e.atkT -= dt * (e.frozen > 0 ? .35 : 1); if (e.atkT <= 0) bossAttack(e);

  if (!boss && f.enemies.every(e => e.dead)) { f.m.dead = true; return winFight(); }
}

function updateProj(dt) {
  const h = G.hero, f = G.fight;
  G.proj = G.proj.filter(p => {
    p.life -= dt; if (p.life <= 0) return false;
    if (p.homing && !p.homing.dead && !p.homing.dying) { const a = Math.atan2(p.homing.y - p.homing.size * .35 - p.y, p.homing.x - p.x), sp = Math.hypot(p.vx, p.vy), cur = Math.atan2(p.vy, p.vx); let da = a - cur; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU; const na = cur + clamp(da, -5 * dt, 5 * dt); p.vx = Math.cos(na) * sp; p.vy = Math.sin(na) * sp; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (f && p.bounce) { const d = dist(p.x, p.y, f.cx, f.cy); if (d > f.r - 8) { const nx = (p.x - f.cx) / d, ny = (p.y - f.cy) / d, dot = p.vx * nx + p.vy * ny; p.vx -= 2 * dot * nx; p.vy -= 2 * dot * ny; p.x = f.cx + nx * (f.r - 9); p.y = f.cy + ny * (f.r - 9); if (--p.bounce < 0) return false; } }

      return true;
    }
    for (const e of liveEnemies()) {
      if (p.hit.has(e)) continue;
      if (dist(p.x, p.y, e.x, e.y - e.size * .35) < p.r + e.size * .38) { hitEnemy(e, p.dmg); p.hit.add(e); sparkBurst(p.x, p.y, 4, [p.col || '#fff3a8'], 120); if (!p.pierce) return false; }
    }
    return true;
  });

    t.t += dt; if (t.t < t.dur) return true;
    if (t.kind === 'sun') { fx('ring', t.x, t.y, { r: t.r, dur: .35, col: '#ffcf3a' }); sparkBurst(t.x, t.y, 10, ['#ffcf3a', '#fff7b0', '#ff8a3d'], 160); if (dist(t.x, t.y, h.x, h.y) < t.r + 8) heroHurt(t.dmg); sfx('boom'); }

    else if (t.kind === 'beam') {
      if (!t.fired) { t.fired = true; t.dur += .35; sfx('beam'); return true; }
      return false;
    } else if (t.kind === 'line' && t.then) t.then();
    return false;
  });
  G.tele.forEach(t => { if (t.kind === 'beam' && t.fired) { const dx = h.x - t.x, dy = h.y - 25 - t.y, along = dx * Math.cos(t.a) + dy * Math.sin(t.a), perp = Math.abs(-dx * Math.sin(t.a) + dy * Math.cos(t.a)); if (along > 0 && along < t.len && perp < t.w / 2 + 10) heroHurt(t.dmg); } });
}

function updateHero(dt) {
  const h = G.hero, S = G.S; h.t += dt;
  ['a', 'b', 'c'].forEach(k => h.cd[k] = Math.max(0, h.cd[k] - dt));
  h.shield = Math.max(0, h.shield - dt); h.inv = Math.max(0, h.inv - dt); h.hurt = Math.max(0, h.hurt - dt); h.spin = Math.max(0, h.spin - dt);

  let mx = Input.mx, my = Input.my; const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  const sp = (G.fight ? CONFIG.fightSpeed : CONFIG.heroSpeed) * (S.look.shoes === 'magic' ? 1.12 : 1);
  let vx = mx * sp, vy = my * sp;
  if (h.dash > 0) { h.dash -= dt; vx = h.dvx; vy = h.dvy; const w = weaponOf(S.look); liveEnemies().forEach(e => { if (!h.dashHit.has(e) && dist(h.x, h.y, e.x, e.y) < 44 + e.size * .35) { h.dashHit.add(e); hitEnemy(e, w.dmg * 2); } }); fx('puff', h.x, h.y - 8, { dur: .3 }); }

  if (h.moving && !G.fight) h.face = vx > 0 ? 1 : vx < 0 ? -1 : h.face;
  else if (h.moving && G.fight && !nearestEnemy(h.x, h.y)) h.face = vx > 0 ? 1 : vx < 0 ? -1 : h.face;
  const nx = h.x + vx * dt, ny = h.y + vy * dt;
  if (!blocked(nx, h.y, 12)) h.x = nx; if (!blocked(h.x, ny, 12)) h.y = ny;
  arenaClamp(h, 16);
  if (G.fight) heroAttack(dt); else { h.atk = Math.max(0, h.atk - dt * 4); h.hp = Math.min(h.max, h.hp + CONFIG.regenOutOfFight * dt); }

    if (dist(h.x, h.y, fd.x, fd.y) < 28) {
      if (S.food < CONFIG.foodMax) { S.food++; toast('+1 ' + FOOD_NAME[fd.kind] + ' (φαγητό ' + S.food + '/' + CONFIG.foodMax + ')'); }
      else if (h.hp < h.max) { h.hp = Math.min(h.max, h.hp + CONFIG.foodHeal); toast('Νόστιμο! ' + FOOD_NAME[fd.kind] + ' +ζωή'); }
      else return;

    }
  });

  if (!G.fight && !G.cine) for (const m of G.monsters) { if (m.hidden && dist(h.x, h.y, m.x, m.y) < (m.group ? CONFIG.revealMini : CONFIG.revealBoss)) { startFight(m); break; } }
  // interaction prompts
  G.prompt = null;
  if (!G.fight) {
    if (dist(h.x, h.y, HOME.door.x, HOME.door.y + 20) < 50) G.prompt = { text: 'Μπες στο σπίτι', act: () => goHouse() };
    else if (dist(h.x, h.y, DOCK.main.x, DOCK.main.y) < 48) G.prompt = { text: 'Βάρκα για το Νησάκι', act: () => boat(DOCK.island) };
    else if (dist(h.x, h.y, DOCK.island.x, DOCK.island.y) < 48) G.prompt = { text: 'Βάρκα για την πόλη', act: () => boat(DOCK.main) };
    else if (G.portal && dist(h.x, h.y, G.portal.x, G.portal.y) < 60) G.prompt = { text: 'Μπες στη μαγική πύλη', act: () => enterPortal() };
  }
  if (G.portal && !G.portal.found && dist(h.x, h.y, G.portal.x, G.portal.y) < 260) { G.portal.found = true; toast('Βρήκες τη μαγική πύλη!', '#ff9bf0'); sfx('portal'); }
}
function boat(to) { const h = G.hero; sfx('splash'); G.fade = { t: 0, dur: .7, mid: () => { h.x = to.x; h.y = to.y; } }; }
function interact() { if (G.mode === 'city' && G.prompt && !G.cine && !G.dead) G.prompt.act(); }
function enterPortal() {
  sfx('portal'); music(null);
  G.fade = { t: 0, dur: 1.4, mid: () => { G.S.finished = true; G.portal = null; saveGame(false); startEnding(); } };
}

function update(dt) {
  G.time += dt;
  G.toasts = G.toasts.filter(t => (t.t += dt) < t.dur);
  if (G.fade) { G.fade.t += dt; if (!G.fade.midDone && G.fade.t > G.fade.dur / 2) { G.fade.midDone = true; G.fade.mid(); } if (G.fade.t >= G.fade.dur) G.fade = null; }
  if (G.mode === 'ending') { G.end.t += dt; return; }
  if (G.mode !== 'city' || G.paused) return;
  if (G.S) G.S.playMs += dt * 1000;
  G.fx = G.fx.filter(f => { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.kind === 'spark') f.vy += 300 * dt; return f.t < f.dur; });
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  if (G.cine) { G.cine.t += dt; if (G.cine.t >= G.cine.dur) { const d = G.cine.done; G.cine = null; d && d(); } return; }
  if (G.freeze > 0) { G.freeze -= dt; return; }
  G.shake = Math.max(0, G.shake - dt);
  updateHero(dt); updateFight(dt); updateProj(dt); updateLife(dt);
  G.saveTimer += dt; if (G.saveTimer > 20 && !G.fight) { G.saveTimer = 0; saveGame(false); }
}

/* ---------- ending ---------- */
function startEnding() {
  G.mode = 'ending'; G.end = { t: 0, shown: false };
  const R = seeded(G.S.seed);
  const fam = G.S.family;
  const mk = (gender, sc) => { const L = randomLook(R); if (gender === 'girl') { L.hair = pick2(R, ['long', 'bun', 'bob', 'curly']); L.bottom = 'skirt'; } if (gender === 'boy') { L.hair = pick2(R, ['short', 'buzz', 'curly']); L.bottom = 'pants'; } return { L, sc }; };
  G.end.people = [Object.assign(mk('girl', 1.12), { name: fam.mom, role: 'Μαμά' }), Object.assign(mk('boy', 1.18), { name: fam.dad, role: 'Μπαμπάς' })]
    .concat(fam.sibs.map(n => Object.assign(mk(R() < .5 ? 'girl' : 'boy', .86), { name: n, role: 'Αδερφάκι' })));
  G.end.hero = plainLook(G.S.look);
  setMode('ending'); music('end');
}

  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);

function viewRect(z) { return { x0: G.cam.x - CW / 2 / z, y0: G.cam.y - CH / 2 / z, x1: G.cam.x + CW / 2 / z, y1: G.cam.y + CH / 2 / z }; }

function renderWorld(dt) {

    case 'bigpop': [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .16, null, t + i * .08)); break;

    case 'shield': tone(660, .4, 'sine', .12, 990); tone(990, .4, 'sine', .08, 1320); break;
    case 'whoosh': noise(.25, .3, 900); break;
    case 'eat': tone(660, .08, 'triangle', .14, null, t); tone(880, .1, 'triangle', .14, null, t + .09); break;
    case 'super': [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .35, 'square', .07, null, t + i * .07)); break;
    case 'win': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .28, 'triangle', .17, null, t + i * .13)); break;
    case 'lose': [440, 392, 349, 294].forEach((f, i) => tone(f, .32, 'triangle', .14, null, t + i * .18)); break;
    case 'reveal': tone(110, .5, 'sawtooth', .12, 90); tone(165, .5, 'sawtooth', .08, 130, t + .25); break;

}
const MUSIC = {
  title: { bpm: 88, mel: [62, 0, 66, 69, 0, 71, 69, 0, 66, 0, 64, 62, 0, 0, 59, 0], bass: [38, 45, 43, 45] },
  house: { bpm: 80, mel: [67, 0, 71, 0, 74, 0, 72, 71, 69, 0, 67, 0, 64, 0, 0, 0], bass: [43, 48, 45, 50] },
  city: { bpm: 104, mel: [62, 64, 66, 0, 69, 0, 66, 64, 62, 0, 59, 0, 61, 62, 0, 0], bass: [38, 43, 45, 43] },
  fight: { bpm: 140, mel: [57, 0, 60, 57, 64, 0, 62, 60, 57, 0, 55, 57, 0, 60, 59, 0], bass: [33, 33, 36, 31] },
  end: { bpm: 76, mel: [72, 0, 76, 0, 79, 0, 76, 74, 72, 0, 74, 76, 72, 0, 0, 0], bass: [48, 53, 55, 48] },

function music(m) { Snd.mode = m; Snd.step = 0; if (Snd.ctx) Snd.next = Snd.ctx.currentTime + .05; }
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function musicTick() {
  const a = Snd.ctx; if (!a || !Snd.mode || !Snd.on) return; const M = MUSIC[Snd.mode]; if (!M) return;
  const st = 60 / M.bpm / 2;
  while (Snd.next < a.currentTime + .25) {

    if (i % 4 === 0) tone(midi(M.bass[(Snd.step / 4 | 0) % 4]), st * 3.5, 'sine', .7, null, Snd.next, Snd.mus);
    Snd.next += st; Snd.step++;

}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  readMove();
  try {

    if (G.mode === 'house') { G.time += dt; drawMirror(); }
