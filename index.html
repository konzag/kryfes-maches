<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Κρυφές Μάχες</title>
<!-- Η γραμματοσειρά έρχεται από το hub (Comfortaa). Κανένα CDN, κανένα Google Fonts (GAME-STANDARD §4). -->
<link rel="stylesheet" href="/static/fonts/comfortaa.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* Layout: full-bleed canvas city; storybook panels dock over it; HUD buttons hug the safe-area corners.
   The shell (menus, screens, buttons) follows the device theme or the remembered toggle: dark "dusk" or light "pastel".
   The canvas city keeps its own day/night colours in both. */
:root{
  --ink:#1b1430; --night:#271d45; --panel:#33285a; --panel2:#43356f;
  --paper:#fff4dc; --muted:#c9bde6; --gold:#ffc94a; --rose:#ff7aa8; --mint:#6fe3c1; --danger:#c62f45;
  --bg:var(--ink); --text:var(--paper); --head:var(--gold); --title:var(--gold); --title-sh:#8a3b6b; --focus:var(--mint);
  --gold-sh:#b8862a; --ghost-sh:#20183c; --tab-sh:#1e1638; --chip-line:var(--panel2); --chip-on:var(--gold);
  --field:var(--night); --field-line:var(--panel2); --dim:rgba(20,14,38,.72); --plate:rgba(27,20,48,.6);
  --shell-bg:rgba(39,29,69,.82); --shell-fg:var(--paper); --sc-bg:var(--paper); --sc-fg:var(--ink);
  --house:radial-gradient(circle at 30% 20%,#4a3466 0,#2b2048 55%,#1b1430 100%);
  --font:'Comfortaa','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --night:#e7dcf7; --panel:#ffffff; --panel2:#efe4fb; --muted:#55477a;
  --bg:#fbf1ff; --text:#2a1f45; --head:#7a2e8e; --title:#c2185b; --title-sh:#ffd27a; --focus:#6a2fd0;
  --gold-sh:#c9962e; --ghost-sh:#cdb9ea; --tab-sh:#d6c4ef; --chip-line:#b9a5e0; --chip-on:#80530a;
  --field:#ffffff; --field-line:#b9a5e0; --dim:rgba(251,241,255,.82); --plate:rgba(255,255,255,.8);
  --shell-bg:rgba(255,255,255,.9); --shell-fg:#2a1f45; --sc-bg:#2a1f45; --sc-fg:#ffffff;
  --house:radial-gradient(circle at 30% 20%,#fff6e6 0,#f6e8ff 55%,#e9d8ff 100%);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--ink)}
button{font-family:var(--font);font-weight:700;cursor:pointer;color:var(--ink);background:var(--gold);border:0;border-radius:14px;
  padding:12px 18px;font-size:18px;box-shadow:0 4px 0 var(--gold-sh);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-sh)}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button.ghost{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 var(--ghost-sh)}
button.danger{background:var(--danger);color:#fff;box-shadow:0 4px 0 #7d1d2c}
button:disabled{opacity:.45;cursor:default}
#bLowFx[aria-pressed="true"]{background:var(--mint);color:var(--ink)}
#bLowFx[aria-pressed="true"]::after{content:' ✓'}
/* always-visible shell buttons */
#shell{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:30}
#shell button{width:52px;height:52px;padding:0;font-size:24px;border-radius:50%;background:var(--shell-bg);color:var(--shell-fg);box-shadow:0 3px 0 rgba(0,0,0,.35)}
/* screens */
/* safe center: a card taller than the window starts at the top and scrolls, instead of being cut off above it. */
#screen{position:fixed;inset:0;z-index:20;display:flex;align-items:safe center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(70px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow:auto}
#screen.dim{background:var(--dim)}
.card{background:var(--panel);border-radius:22px;padding:24px;box-shadow:0 10px 0 rgba(0,0,0,.25);max-width:900px;width:100%;box-sizing:border-box}
.card.plate{background:var(--plate);box-shadow:none}
.title{font-size:clamp(44px,9vw,96px);font-weight:700;line-height:.95;margin:0;text-align:center;color:var(--title);
  text-shadow:0 5px 0 var(--title-sh),0 10px 24px rgba(0,0,0,.35);letter-spacing:.01em;text-wrap:balance}
/* animated logo (G1-GFX): the letters pop in once, then bob in a slow wave under a neon underline; static with reduced motion */
.logo{position:relative;padding-bottom:.18em}
.logo .w{display:inline-block;white-space:nowrap}
.logo .lt{display:inline-block;animation:ltIn .5s cubic-bezier(.3,1.6,.5,1) both,ltBob 3.2s ease-in-out infinite;
  animation-delay:calc(var(--i) * 45ms),calc(.6s + var(--i) * 120ms)}
.logo .bar{position:absolute;left:12%;right:12%;bottom:0;height:.09em;border-radius:1em;
  background:linear-gradient(90deg,#ff4fa3,#ffe14d,#39e5ff,#8cff6a,#b98cff,#ff4fa3);background-size:200% 100%;
  box-shadow:0 0 14px rgba(255,79,163,.55);animation:barRun 4s linear infinite}
.logo .spk{position:absolute;font-size:.32em;color:#fff7b0;text-shadow:0 0 8px #ffe14d;animation:spk 2.4s ease-in-out infinite}
.logo .spk.a{left:4%;top:-.15em}.logo .spk.b{right:3%;top:.55em;animation-delay:1.2s}
@keyframes ltIn{from{transform:translateY(.5em) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes ltBob{0%,100%{translate:0 0}50%{translate:0 -.06em}}
@keyframes barRun{to{background-position:-200% 0}}
@keyframes spk{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.15) rotate(25deg);opacity:1}}
/* short transitions between screens: the card pops (transform only), the dim backdrop fades in, the house comes out
   of an ink veil. No opacity on the card itself, so its text keeps full contrast from the first frame. */
#screen:not([hidden]) > .card{animation:cardIn .22s ease-out both}
#screen.dim:not([hidden]){animation:dimIn .22s ease-out both}
#house::after{content:'';position:absolute;inset:0;background:var(--ink);pointer-events:none;opacity:0}
#house:not([hidden])::after{animation:veil .3s ease-out both}
@keyframes cardIn{from{transform:translateY(12px) scale(.97)}to{transform:none}}
@keyframes dimIn{from{background-color:transparent}}
@keyframes veil{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.logo .lt,.logo .bar,.logo .spk,#screen:not([hidden]) > .card{animation:none}}
.sub{color:var(--muted);text-align:center;font-size:18px;margin:14px auto 26px;max-width:34em;line-height:1.5}
h2{margin:0 0 14px;font-size:28px;color:var(--head);text-wrap:balance}
p{line-height:1.55;font-size:18px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.row.settings{margin-top:14px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.slot{background:var(--panel2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;min-width:0}
.slot canvas{width:120px;height:120px;border-radius:50%;background:var(--night)}
.slot .nm{font-size:22px;font-weight:700}
.slot .pg{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.pick button{background:var(--panel2);color:var(--text);box-shadow:0 5px 0 var(--tab-sh);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px}
.pick button.on{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-sh)}
.pick canvas{width:150px;height:170px;max-width:100%}
label.f{display:block;font-size:18px;margin-bottom:8px;color:var(--muted)}
input#heroName{font-family:var(--font);font-size:24px;font-weight:700;width:100%;box-sizing:border-box;border-radius:14px;border:3px solid var(--field-line);
  background:var(--field);color:var(--text);padding:12px 14px;-webkit-user-select:text;user-select:text}
input#heroName:focus{outline:none;border-color:var(--gold)}
/* wardrobe */
#house{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:minmax(260px,38%) 1fr;gap:14px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(70px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--house)}
.mirrorBox{background:linear-gradient(#6b4a2b,#4a321d);border-radius:120px 120px 22px 22px;padding:14px;display:flex;flex-direction:column;min-height:0}
.mirrorBox .glass{flex:1;min-height:0;border-radius:110px 110px 12px 12px;background:radial-gradient(circle at 50% 35%,#cfe9ff 0,#8fb4d9 60%,#6a8fb8 100%);overflow:hidden;position:relative}
#mirror{position:absolute;inset:0;width:100%;height:100%}
.mstats{color:#ffe9c4;font-size:15px;line-height:1.5;padding:10px 6px 0;font-variant-numeric:tabular-nums}
.ward{display:flex;flex-direction:column;min-height:0;min-width:0;gap:10px}
.whead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.whead h2{margin:0}
.whead .pg{color:var(--muted);font-size:16px}
/* horizontal rows (tabs, chips, short-screen options): snap, edge fade + ‹ › only while there is more to see */
.scroller{position:relative;display:flex;min-width:0;flex-shrink:0}
.scroller > .tabs,.scroller > .chips,.scroller > .grid{flex:1;min-width:0}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity;scroll-padding-inline:40px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tabs > *,.chips > *{scroll-snap-align:start;flex-shrink:0}
.sc{position:absolute;top:50%;z-index:2;width:36px;height:36px;margin-top:-20px;padding:0;border-radius:50%;font-size:24px;line-height:1;
  background:var(--sc-bg);color:var(--sc-fg);box-shadow:0 2px 0 rgba(0,0,0,.4);display:none}
.sc.prev{left:-6px}.sc.next{right:-6px}
.scroller.can-l > .prev,.scroller.can-r > .next{display:block}
.scroller.can-l > :not(.sc){-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 44px);mask-image:linear-gradient(90deg,transparent 0,#000 44px)}
.scroller.can-r > :not(.sc){-webkit-mask-image:linear-gradient(270deg,transparent 0,#000 44px);mask-image:linear-gradient(270deg,transparent 0,#000 44px)}
.scroller.can-l.can-r > :not(.sc){-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 44px,#000 calc(100% - 44px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 44px,#000 calc(100% - 44px),transparent 100%)}
.gridbox{flex:1;min-height:0}
.tabs button{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 var(--tab-sh);font-size:17px;white-space:nowrap;padding:10px 14px}
.tabs button.on{background:var(--rose);color:var(--ink);box-shadow:0 4px 0 #b44a73}
.chips button{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--chip-line);font-size:15px;padding:7px 12px;white-space:nowrap;border-radius:999px}
.chips button.on{border-color:var(--gold);color:var(--chip-on)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;align-content:start;padding:4px 2px 8px}
.opt{background:var(--panel);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text);
  box-shadow:0 3px 0 var(--tab-sh);font-size:13px;position:relative;min-width:0}
.opt canvas{width:76px;height:76px}
.opt .sw{width:54px;height:54px;border-radius:50%;margin:11px 0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.opt span{line-height:1.25;text-align:center;overflow-wrap:anywhere}
.opt.on{outline:3px solid var(--gold);background:var(--panel2)}
.opt.lock{color:var(--muted)}
.opt.lock canvas,.opt.lock .sw{filter:grayscale(1);opacity:.45}
.opt .lk{position:absolute;top:6px;right:8px;font-size:14px}
.opt .nw{position:absolute;top:4px;left:6px;font-size:11px;background:var(--mint);color:var(--ink);border-radius:8px;padding:2px 5px}
.wbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0;margin-top:auto}
.hint{color:var(--muted);font-size:15px;min-height:1.3em;flex-shrink:0}
/* short screens (phone landscape): small mirror, one-line hint (tap = whole text), the options as one row of cards
   between the chips and the buttons; the heading leaves room for the shell buttons at the top right */
@media (max-height:500px){
  #house{grid-template-columns:minmax(140px,24%) 1fr;gap:10px;
    padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
  .mirrorBox{padding:8px;border-radius:70px 70px 14px 14px}
  .mirrorBox .glass{border-radius:62px 62px 8px 8px}
  .mstats{font-size:11px;line-height:1.35;padding:6px 2px 0}
  .ward{gap:6px}
  .whead{min-height:56px;padding-right:232px;align-content:flex-start;gap:2px 10px}
  .whead h2{font-size:20px}
  .whead .pg{font-size:13px}
  .tabs button{font-size:15px;padding:8px 12px}
  .chips button{font-size:13px;padding:5px 10px}
  .hint{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0;cursor:pointer}
  .hint.open{white-space:normal}
  .gridbox{flex:0 0 auto}
  .grid{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:88px;overflow:auto hidden;scroll-snap-type:x proximity;
    scroll-padding-inline:40px;padding:4px 2px 6px;scrollbar-width:none}
  .grid::-webkit-scrollbar{display:none}
  .opt{scroll-snap-align:start;padding:6px 4px;min-height:72px;justify-content:center}
  .opt canvas{width:56px;height:56px}
  .opt .sw{width:44px;height:44px;margin:6px 0}
  .opt span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .wbar{flex-wrap:nowrap}
  .wbar button{font-size:15px;padding:8px 12px}
}
/* narrow or portrait windows (KM-34, KM-36): mirror on top, wardrobe below; short screens keep the block above (KM-35) */
@media (max-width:820px) and (min-height:501px),(orientation:portrait) and (max-width:1024px){
  #house{grid-template-columns:1fr;grid-template-rows:28% 1fr}
  .mirrorBox{border-radius:60px 60px 16px 16px;flex-direction:row;gap:10px}
  .mirrorBox .glass{border-radius:50px 50px 10px 10px}
  .mstats{width:40%;font-size:12px;padding:0;overflow:hidden}
  .whead h2{font-size:22px}
  .hint{font-size:14px}
  .wbar{gap:8px}
  .wbar button{font-size:15px;padding:9px 12px}
}
/* touch controls */
#touch{position:fixed;inset:0;z-index:10;pointer-events:none}
#stick{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:150px;height:150px;border-radius:50%;
  background:rgba(255,244,220,.13);border:3px solid rgba(255,244,220,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,201,74,.75)}
#pads{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;
  grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,72px);gap:10px;pointer-events:auto}
#pads button{width:72px;height:72px;padding:0;border-radius:50%;font-size:28px;background:rgba(51,40,90,.85);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(27,20,48,.9);position:relative;overflow:hidden;touch-action:none;
  text-shadow:1px 1px 0 #1b1430,-1px 1px 0 #1b1430,1px -1px 0 #1b1430,-1px -1px 0 #1b1430}
#pads button .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
#pads button.ready{background:rgba(255,122,168,.9)}
#pads button.use{background:rgba(111,227,193,.9);color:var(--ink)}
#pads button:disabled{opacity:.35}
#rotate{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;font-size:22px;padding:24px}
#rotate .ph{font-size:72px;animation:rot 1.6s ease-in-out infinite}
/* On the menus (title, slots, create, pause...) the hint is only a strip at the bottom that taps pass through, so the
   menus stay readable and can be tapped in portrait too (GAME-STANDARD §3a). The full cover is for play only. */
#rotate.strip{inset:auto 0 0 0;flex-direction:row;gap:10px;pointer-events:none;font-size:18px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:3px solid var(--panel2)}
#rotate.strip .ph{font-size:28px}
body.rotstrip #screen{padding-bottom:72px}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none}button{transition:none}}
.toastline{font-size:15px;color:var(--muted);text-align:center;margin-top:12px}
.serverbox{margin:0 0 14px;padding:12px 14px;border-radius:16px;background:var(--panel2);text-align:center}
.serverbox p{margin:0 0 8px;font-size:18px}
.serverbox input{font-family:var(--font);font-size:18px;padding:10px 12px;border-radius:12px;border:0;width:9em}
.endnames{font-size:20px;line-height:1.7;text-align:center}
</style>
</head>
<body>

<canvas id="game" aria-label="Κρυφές Μάχες"></canvas>
<div id="touch" hidden>
  <div id="stick"><div id="knob"></div></div>
  <div id="pads">
    <button id="pA" aria-label="Ικανότητα 1">⚡<span class="cd"></span></button>
    <button id="pB" aria-label="Ικανότητα 2">💨<span class="cd"></span></button>
    <button id="pS" aria-label="Σούπερ">★<span class="cd"></span></button>
    <button id="pC" aria-label="Ασπίδα">🛡<span class="cd"></span></button>
    <button id="pF" aria-label="Φαγητό">🥧<span class="cd"></span></button>
    <button id="pE" aria-label="Μπες">👆<span class="cd"></span></button>
  </div>
</div>
<div id="screen" hidden></div>
<div id="house" hidden>
  <div class="mirrorBox"><div class="glass"><canvas id="mirror"></canvas></div><div class="mstats" id="mstats"></div></div>
  <div class="ward">
    <div class="whead"><h2 id="wTitle">Το σπίτι μου</h2><span class="pg" id="wProg"></span></div>
    <div class="scroller" id="wTabsBox"><button class="sc prev" tabindex="-1" aria-hidden="true">‹</button><div class="tabs" id="wTabs"></div><button class="sc next" tabindex="-1" aria-hidden="true">›</button></div>
    <div class="scroller" id="wChipsBox"><button class="sc prev" tabindex="-1" aria-hidden="true">‹</button><div class="chips" id="wChips"></div><button class="sc next" tabindex="-1" aria-hidden="true">›</button></div>
    <div class="hint" id="wHint" aria-live="polite"></div>
    <div class="scroller gridbox" id="wGridBox"><button class="sc prev" tabindex="-1" aria-hidden="true">‹</button><div class="grid" id="wGrid"></div><button class="sc next" tabindex="-1" aria-hidden="true">›</button></div>
    <div class="wbar">
      <button class="ghost" id="wRandom">🎲 Τυχαίο</button>
      <button class="ghost" id="wSave">💾 Αποθήκευση</button>
      <button id="wOut">🚪 Βγες στην πόλη</button>
    </div>
  </div>
</div>
<div id="shell">
  <button id="bPause" aria-label="Παύση">⏸</button>
  <button id="bSound" aria-label="Ήχος">🔊</button>
  <button id="bFull" aria-label="Πλήρης οθόνη">⛶</button>
  <button id="bHome" aria-label="Πίσω στα παιχνίδια">🏠</button>
</div>
<div id="rotate" hidden><div class="ph">📱</div><div>Γύρισε τη συσκευή οριζόντια για να παίξεις!</div></div>
<script>
'use strict';
/* ============================================================
   Κρυφές Μάχες v1 — household game (GAME-STANDARD v1)
   ============================================================ */
const CONFIG = {
  slug: 'kryfes-maches',
  hubPath: '/kryfes-maches',      // when served from the hub, 🏠 goes to '/'
  serverSave: true,               // level B saves on the hub (games-hub GAMES saves=True); falls back to the device
  saveMaxBytes: 65536,            // hub limit for one save (PUT body)
  heroHp: 100,
  heroSpeed: 175,                 // world units per second while exploring
  fightSpeed: 160,
  exploreHeroScreen: 0.20,        // hero height as share of screen height
  fightHeroScreen: 0.13,
  bossBaseHp: 1500,
  bossMinSeconds: 95,             // boss hp never lower than est. dps * this
  miniHp: 45,

  foodMax: 3,

/* ---------- save (level A: device; level B: the hub, see Server) ----------
   One key game.kryfes-maches.v1 = { v, slots: [3 saves] (device), profile, remote: { <profile id>: [3 saves] },
   dirty: { '<profile id>:<slot>': true } }. remote/dirty are the level B cache; schema v stays 1 (old saves load). */
const Store = {
  mem: null,
  // The 3 slots of one owner: 'local' = this device only, a hub profile id = that profile's cached saves.
  slots(d, owner) {
    if (!owner || owner === 'local') return d.slots;
    d.remote = d.remote || {};
    if (!Array.isArray(d.remote[owner])) d.remote[owner] = [null, null, null];
    return d.remote[owner];

  markDirty(d, owner, i) { if (owner && owner !== 'local') { d.dirty = d.dirty || {}; d.dirty[owner + ':' + i] = true; } },
  hold: false, // true when an unreadable save could not be backed up: then write() keeps to memory and never replaces it
  read() {
    try {
      const s = localStorage.getItem(SAVE_KEY);

        if (d && d.v === SCHEMA && Array.isArray(d.slots)) return d;
        this.backup(s); // unreadable, or from a newer SCHEMA: keep a copy before the next write replaces it
      }

const Server = {
  on: CONFIG.serverSave, state: 'off', profiles: [], profile: null, // state: 'off' | 'locked' | 'ok'
  async request(method, path, body) {
    try {

      if (body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
      return await fetch(path, init);

  async refresh() {
    if (!this.on) { this.state = 'off'; return; }
    const res = await this.request('GET', '/api/profiles');
    if (res && res.status === 200) {
      const b = await res.json().catch(() => ({}));
      this.profiles = Array.isArray(b.profiles) ? b.profiles : [];

  async unlock(pin) {
    const res = await this.request('POST', '/api/unlock', { pin });
    if (res && res.status === 204) { await this.refresh(); return 'ok'; }

    return null;
  },
  choose(p) { this.profile = p ? { id: p.id, name: p.name } : null; const d = Store.read(); d.profile = this.profile; Store.write(d); },
  owner() { return this.on && this.state === 'ok' && this.profile ? String(this.profile.id) : 'local'; },
  url(owner, i) { return '/api/save/' + encodeURIComponent(CONFIG.slug) + '/' + encodeURIComponent(owner) + '/' + (i + 1); },
  async push(owner, i) {
    if (!this.on || owner === 'local' || this.state !== 'ok') return;
    const sl = Store.slots(Store.read(), owner)[i];
    // An erased slot is sent as a tombstone: the hub API has no DELETE.
    const body = { schema: SCHEMA, saved_at: sl ? sl.saved : Date.now(), data: sl || { deleted: true } };
    if (JSON.stringify(body).length > CONFIG.saveMaxBytes) return; // stays on the device
    const res = await this.request('PUT', this.url(owner, i), body);
    if (res && res.status === 204) { const d = Store.read(); if (d.dirty) delete d.dirty[owner + ':' + i]; Store.write(d); }

    if (res && res.status === 401) this.state = 'locked';
  },
  async pull(owner, i) {
    if (!this.on || owner === 'local' || this.state !== 'ok') return;
    const d0 = Store.read();
    if (d0.dirty && d0.dirty[owner + ':' + i]) return this.push(owner, i); // the device has the newest copy
    const res = await this.request('GET', this.url(owner, i));
    if (res && res.status === 401) { this.state = 'locked'; return; }
    if (!res || res.status !== 200) return;
    const r = await res.json().catch(() => null);
    const d = Store.read(), arr = Store.slots(d, owner), local = arr[i];

    }
  },
  async syncPending() {
    if (!this.on || this.state !== 'ok') return;
    for (const key of Object.keys(Store.read().dirty || {})) {
      if (this.state !== 'ok') return; // a 401 locked the home save: the rest waits for the PIN
      const k = key.lastIndexOf(':'); await this.push(key.slice(0, k), +key.slice(k + 1));
    }
  },
};
Server.profile = Store.read().profile || null;

/* ---------- ambient life ---------- */

const WALK_RECTS = ROADS.concat([PROMENADE, PLAZA]);

];

function updateLife(dt) {

    case 'dash': { let dx = Input.mx, dy = Input.my; if (!dx && !dy) { if (tgt) { dx = tgt.x - h.x; dy = tgt.y - h.y; } else dx = h.face; } const d = Math.hypot(dx, dy) || 1; h.dash = .22; h.dvx = dx / d * 780; h.dvy = dy / d * 780; h.dashHit = new Set(); sfx('whoosh'); break; }
    case 'rain': { const tx = tgt ? tgt.x : h.x + h.face * 140, ty = tgt ? tgt.y : h.y; G.tele.push({ kind: 'rain', x: tx, y: ty, r: 95, t: 0, dur: .55, friendly: true, dmg: w.dmg * 3.2 }); sfx('shoot'); break; }
    case 'fan': if (tgt) for (let i = -2; i <= 2; i++) shootAt(h.x + h.face * 14, h.y - 36, tgt, w, w.dmg * 1.2, i * .22); sfx('shoot'); break;
    case 'nova': for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; G.proj.push({ x: h.x, y: h.y - 30, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, r: 7, dmg: w.dmg * 1.3, kind: 'starbolt', owner: 'hero', life: .9, hit: new Set(), seed: Math.random() }); } sfx('zap'); break;
    case 'frost': fx('ring', h.x, h.y - 25, { r: 210, dur: .6, col: '#bff3ff' }); for (let i = 0; i < 30; i++) fx('snow', h.x + rnd(-200, 200), h.y + rnd(-160, 120), { dur: 1.2, vy: 30 }); liveEnemies().forEach(e => { if (dist(h.x, h.y, e.x, e.y) < 210 + e.size * .4) { e.frozen = 2.6; hitEnemy(e, w.dmg * 1.5); } }); sfx('frost'); break;

}
function eatFood() {

  G.S.food--; h.hp = Math.min(h.max, h.hp + CONFIG.foodHeal); for (let i = 0; i < 8; i++) fx('heart', h.x + rnd(-18, 18), h.y - 40, { vy: -50, dur: 1 }); sfx('eat');
}
function useSuper() {
  const h = G.hero; if (!h || G.mode !== 'city' || G.dead || G.cine || h.superC < CONFIG.superCharge || !G.fight) return;
  h.superC = 0; sfx('super');
  G.cine = { kind: 'super', t: 0, dur: 1.15, text: upGR('Σούπερ ' + weaponOf(G.S.look).label) + '!', done: () => {
    const w = weaponOf(G.S.look); G.proj = G.proj.filter(p => p.owner === 'hero'); G.tele = G.tele.filter(t => t.friendly);

    liveEnemies().forEach(e => hitEnemy(e, w.dmg * 9)); shakeHit(.5);
  } };
}
function heroHurt(dmg, src) {
  const h = G.hero; if (h.inv > 0 || h.shield > 0 || h.dash > 0 || G.dead) return;
  const def = armorDef(G.S.look); dmg *= (1 - .09 * def);
  h.hp -= dmg; h.inv = .75; h.hurt = .35; h.expr = 'ouch'; h.exprT = .5; shakeHit(.25);
  dmgText(h.x, h.y - 70, dmg, '#ff9a8f'); sfx('hurt');
  if (h.hp <= 0) { h.hp = 0; loseFight(); }
}
function loseFight() {
  G.dead = .001; sfx('lose'); music(null);
}
function finishLose() {
  const f = G.fight, m = f && f.m;
  if (m) { m.hidden = true; m.state = 'hidden'; m.dying = 0; if (!m.group) { m.x = m.def.x; m.y = m.def.y; } }
  G.fight = null; G.proj = []; G.tele = []; G.dead = 0;
  G.hero.hp = G.hero.max; G.hero.fall = 0; G.S.food = Math.max(G.S.food, 2);

}
function winFight() {
  const f = G.fight, m = f.m, S = G.S;
  const before = battlesWon(S);
  if (m.group) S.minis.push(m.id); else S.bosses.push(m.id);
  const after = battlesWon(S);
  G.monsters = G.monsters.filter(x => x !== m);
  G.fight = null; G.proj = G.proj.filter(p => p.owner === 'hero'); G.tele = [];
  music('city');
  const won = m.group ? 'Νίκησες τα Σκιουλάκια!' : 'Νίκησες ' + m.acc + '!';
  G.cine = { kind: 'win', t: 0, dur: 1.9, text: won, done: () => {
    const nw = WEAPONS.find(x => x.unlock === after && x.unlock > before);
    if (nw) toast('Νέο όπλο: ' + nw.label + '! Φόρεσέ το στο σπίτι.', '#ffc94a');
    let cnt = 0; Object.keys(CAT).forEach(k => { if (k === 'weapon') return; CAT[k].opts.forEach(o => { if (o.unlock > before && o.unlock <= after) cnt++; }); });
    if (cnt) toast(cnt + (cnt === 1 ? ' νέο πράγμα' : ' νέα πράγματα') + ' στη ντουλάπα του σπιτιού!', '#6fe3c1');
    if (!m.group && S.bosses.length >= 5 && !G.portal) { G.portal = portalSpot(); toast('Η μαγική πύλη άνοιξε κάπου στην πόλη! Ψάξε τη!', '#ff9bf0'); sfx('portal'); }
    const left = 5 - S.bosses.length; if (!m.group && left > 0) toast(left === 1 ? 'Μένει 1 τέρας κρυμμένο στην πόλη.' : 'Μένουν ' + left + ' τέρατα κρυμμένα στην πόλη.');
    saveGame(false);
  } };

}

/* ---------- boss patterns ---------- */
function bossAttack(m) {
  const h = G.hero, phase = m.hp / m.max < .33 ? 2 : m.hp / m.max < .66 ? 1 : 0;
  const pat = m.def.pats[m.pi++ % m.def.pats.length];
  const ox = m.x, oy = m.y - m.size * .5, aim = Math.atan2(h.y - 30 - oy, h.x - ox);
  const dmgOf = { rock: 12, furball: 9, sun: 11, bag: 10, pie: 10 }[m.def.proj];
  const shot = (a, sp, extra) => G.proj.push(Object.assign({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: m.def.proj === 'rock' ? 9 : 11, dmg: dmgOf, kind: m.def.proj, owner: 'enemy', life: 4, seed: Math.random() }, extra || {}));
  m.atkAnim = 1;
  switch (pat) {
    case 'aimed': { const n = 3 + phase; for (let i = 0; i < n; i++) m.queue.push({ t: i * .28, fn: () => shot(Math.atan2(G.hero.y - 30 - oy, G.hero.x - ox) + rnd(-.06, .06), 270 + phase * 30) }); break; }
    case 'spread': { const n = 5 + phase * 2; for (let i = 0; i < n; i++) shot(aim + (i - (n - 1) / 2) * .2, 230); break; }
    case 'ring': { const n = 10 + phase * 3, off = Math.random(); for (let i = 0; i < n; i++) shot((i + off) / n * TAU, 190); break; }
    case 'bounce': for (let i = 0; i < 3 + phase; i++) shot(Math.random() * TAU, 230, { bounce: 2 + phase, life: 6 }); break;
    case 'charge': G.tele.push({ kind: 'line', x: m.x, y: m.y, x2: h.x, y2: h.y, w: m.size * .6, t: 0, dur: .7, then: () => { const a = Math.atan2(G.hero.y - m.y, G.hero.x - m.x); m.vx = Math.cos(a) * 560; m.vy = Math.sin(a) * 560; m.charge = .5; sfx('whoosh'); } }); break;
    case 'rain': { const n = 4 + phase * 2; for (let i = 0; i < n; i++) { const a = Math.random() * TAU, r = i === 0 ? 0 : rnd(40, 150); G.tele.push({ kind: 'sun', x: h.x + Math.cos(a) * r, y: h.y + Math.sin(a) * r * .7, r: 46, t: -i * .12, dur: 1.15, dmg: 13 }); } break; }
    case 'beam': { const a = aim; G.tele.push({ kind: 'beam', x: ox, y: oy, a, len: 520, w: 34, t: 0, dur: .85, dmg: 15 }); m.queue.push({ t: .9, fn: () => { for (let i = -1; i <= 1; i++) shot(a + i * .35, 240); } }); break; }
    case 'summon': for (let i = 0; i < 2; i++) { const hp = CONFIG.miniHp * .8; G.fight.enemies.push({ kind: 'mini', x: m.x + (i ? 60 : -60), y: m.y + 20, size: 36, hp, max: hp, seed: Math.random() * 9, shoot: 2.5, flash: 0, frozen: 0, state: 'fight' }); } sparkBurst(m.x, m.y - 30, 20, ['#c9b5ff']); break;
  }
  m.atkT = (2.15 - phase * .35) * rnd(.85, 1.15);
}

function updateFight(dt) {
  const f = G.fight; if (!f) return; f.t += dt;
  const h = G.hero;
  f.enemies.forEach(e => {
    if (e.dead) return;
    e.flash = Math.max(0, e.flash - dt); e.frozen = Math.max(0, e.frozen - dt);
    const slow = e.frozen > 0 ? .3 : 1;
    if (e.dying) { e.dying += dt; return; }
    if (e.kind === 'mini') {
      const d = dist(e.x, e.y, h.x, h.y), a = Math.atan2(h.y - e.y, h.x - e.x);
      if (d > 34) { e.x += Math.cos(a) * 78 * slow * dt; e.y += Math.sin(a) * 78 * slow * dt; }
      f.enemies.forEach(o => { if (o !== e && !o.dead && o.kind === 'mini') { const dd = dist(e.x, e.y, o.x, o.y); if (dd < 40 && dd > 0) { e.x += (e.x - o.x) / dd * 30 * dt; e.y += (e.y - o.y) / dd * 30 * dt; } } });
      arenaClamp(e, 20);
      if (d < 30) heroHurt(6);
      e.shoot -= dt * slow; if (e.shoot <= 0) { e.shoot = rnd(2.6, 3.6); G.proj.push({ x: e.x, y: e.y - 22, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, r: 7, dmg: 7, kind: 'shadow', owner: 'enemy', life: 3, seed: Math.random() }); }
      return;
    }
    // boss
    e.atkAnim = Math.max(0, e.atkAnim - dt * 2.5);
    e.queue = e.queue.filter(q => { q.t -= dt; if (q.t <= 0) { q.fn(); return false; } return true; });
    if (e.charge > 0) { e.charge -= dt; e.x += e.vx * dt; e.y += e.vy * dt; arenaClamp(e, e.size * .4); }
    else if (e.def.mobile) {
      const d = dist(e.x, e.y, h.x, h.y), want = e.kind === 'rock' || e.kind === 'pie' ? 110 : 190;
      const a = Math.atan2(h.y - e.y, h.x - e.x) + Math.sin(f.t * .7) * .9, sp = (d > want ? 52 : -30) * slow;
      e.x += Math.cos(a) * sp * dt; e.y += Math.sin(a) * sp * dt; arenaClamp(e, e.size * .4);
      if (e.kind === 'rock') { const C = CASTLE; e.x = clamp(e.x, C.x + 50, C.x + C.w - 50); e.y = clamp(e.y, C.y + 60, C.y + C.h - 40); }
    } else { e.y = e.def.y + Math.sin(f.t) * 8; }
    if (dist(e.x, e.y - e.size * .25, h.x, h.y - 25) < e.size * .42 + 12) heroHurt(e.charge > 0 ? 15 : 9);
    e.atkT -= dt * (e.frozen > 0 ? .35 : 1); if (e.atkT <= 0) bossAttack(e);
  });
  const boss = f.type === 'boss' ? f.m : null;
  if (boss && boss.dying > 1) return winFight();
  if (!boss && f.enemies.every(e => e.dead)) { f.m.dead = true; return winFight(); }
}

function updateProj(dt) {
  const h = G.hero, f = G.fight;
  G.proj = G.proj.filter(p => {
    p.life -= dt; if (p.life <= 0) return false;
    if (p.homing && !p.homing.dead && !p.homing.dying) { const a = Math.atan2(p.homing.y - p.homing.size * .35 - p.y, p.homing.x - p.x), sp = Math.hypot(p.vx, p.vy), cur = Math.atan2(p.vy, p.vx); let da = a - cur; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU; const na = cur + clamp(da, -5 * dt, 5 * dt); p.vx = Math.cos(na) * sp; p.vy = Math.sin(na) * sp; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (f && p.bounce) { const d = dist(p.x, p.y, f.cx, f.cy); if (d > f.r - 8) { const nx = (p.x - f.cx) / d, ny = (p.y - f.cy) / d, dot = p.vx * nx + p.vy * ny; p.vx -= 2 * dot * nx; p.vy -= 2 * dot * ny; p.x = f.cx + nx * (f.r - 9); p.y = f.cy + ny * (f.r - 9); if (--p.bounce < 0) return false; } }
    if (p.owner === 'enemy') {
      if (f && dist(p.x, p.y, f.cx, f.cy) > f.r + 140) return false;
      if (dist(p.x, p.y, h.x, h.y - 28) < p.r + 13) { if (h.shield > 0) { sparkBurst(p.x, p.y, 6, ['#9fe0ff', '#ffffff'], 140); return false; } heroHurt(p.dmg); return false; }
      return true;
    }
    for (const e of liveEnemies()) {
      if (p.hit.has(e)) continue;
      if (dist(p.x, p.y, e.x, e.y - e.size * .35) < p.r + e.size * .38) { hitEnemy(e, p.dmg); p.hit.add(e); sparkBurst(p.x, p.y, 4, [p.col || '#fff3a8'], 120); if (!p.pierce) return false; }
    }
    return true;
  });
  G.tele = G.tele.filter(t => {
    t.t += dt; if (t.t < t.dur) return true;
    if (t.kind === 'sun') { fx('ring', t.x, t.y, { r: t.r, dur: .35, col: '#ffcf3a' }); sparkBurst(t.x, t.y, 10, ['#ffcf3a', '#fff7b0', '#ff8a3d'], 160); if (dist(t.x, t.y, h.x, h.y) < t.r + 8) heroHurt(t.dmg); sfx('boom'); }
    else if (t.kind === 'rain') { for (let i = 0; i < 14; i++) fx('arrowfall', t.x + rnd(-t.r, t.r) * .8, t.y + rnd(-t.r, t.r) * .5, { dur: .3 + Math.random() * .2 }); liveEnemies().forEach(e => { if (dist(t.x, t.y, e.x, e.y) < t.r + e.size * .4) hitEnemy(e, t.dmg); }); }
    else if (t.kind === 'beam') {
      if (!t.fired) { t.fired = true; t.dur += .35; sfx('beam'); return true; }
      return false;
    } else if (t.kind === 'line' && t.then) t.then();
    return false;
  });
  G.tele.forEach(t => { if (t.kind === 'beam' && t.fired) { const dx = h.x - t.x, dy = h.y - 25 - t.y, along = dx * Math.cos(t.a) + dy * Math.sin(t.a), perp = Math.abs(-dx * Math.sin(t.a) + dy * Math.cos(t.a)); if (along > 0 && along < t.len && perp < t.w / 2 + 10) heroHurt(t.dmg); } });
}

function updateHero(dt) {
  const h = G.hero, S = G.S; h.t += dt;
  ['a', 'b', 'c'].forEach(k => h.cd[k] = Math.max(0, h.cd[k] - dt));
  h.shield = Math.max(0, h.shield - dt); h.inv = Math.max(0, h.inv - dt); h.hurt = Math.max(0, h.hurt - dt); h.spin = Math.max(0, h.spin - dt);
  h.exprT -= dt; if (h.exprT <= 0) h.expr = G.fight ? 'grit' : 'happy';
  if (G.dead) { h.fall = Math.min(1, h.fall + dt * 1.6); G.dead += dt; if (G.dead > 1.6) finishLose(); return; }
  let mx = Input.mx, my = Input.my; const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  const sp = (G.fight ? CONFIG.fightSpeed : CONFIG.heroSpeed) * (S.look.shoes === 'magic' ? 1.12 : 1);
  let vx = mx * sp, vy = my * sp;
  if (h.dash > 0) { h.dash -= dt; vx = h.dvx; vy = h.dvy; const w = weaponOf(S.look); liveEnemies().forEach(e => { if (!h.dashHit.has(e) && dist(h.x, h.y, e.x, e.y) < 44 + e.size * .35) { h.dashHit.add(e); hitEnemy(e, w.dmg * 2); } }); fx('puff', h.x, h.y - 8, { dur: .3 }); }
  h.moving = Math.hypot(vx, vy) > 5;
  if (h.moving && !G.fight) h.face = vx > 0 ? 1 : vx < 0 ? -1 : h.face;
  else if (h.moving && G.fight && !nearestEnemy(h.x, h.y)) h.face = vx > 0 ? 1 : vx < 0 ? -1 : h.face;
  const nx = h.x + vx * dt, ny = h.y + vy * dt;
  if (!blocked(nx, h.y, 12)) h.x = nx; if (!blocked(h.x, ny, 12)) h.y = ny;
  arenaClamp(h, 16);
  if (G.fight) heroAttack(dt); else { h.atk = Math.max(0, h.atk - dt * 4); h.hp = Math.min(h.max, h.hp + CONFIG.regenOutOfFight * dt); }
  // food
  G.foods.forEach(fd => {
    if (!fd.ready) { fd.t -= dt; if (fd.t <= 0) fd.ready = true; return; }
    if (dist(h.x, h.y, fd.x, fd.y) < 28) {
      if (S.food < CONFIG.foodMax) { S.food++; toast('+1 ' + FOOD_NAME[fd.kind] + ' (φαγητό ' + S.food + '/' + CONFIG.foodMax + ')'); }
      else if (h.hp < h.max) { h.hp = Math.min(h.max, h.hp + CONFIG.foodHeal); toast('Νόστιμο! ' + FOOD_NAME[fd.kind] + ' +ζωή'); }
      else return;
      fd.ready = false; fd.t = CONFIG.foodRespawn; sfx('eat'); sparkBurst(fd.x, fd.y - 12, 10, ['#ffd23f', '#fff4dc']);
    }
  });
  // reveal hidden monsters
  if (!G.fight && !G.cine) for (const m of G.monsters) { if (m.hidden && dist(h.x, h.y, m.x, m.y) < (m.group ? CONFIG.revealMini : CONFIG.revealBoss)) { startFight(m); break; } }
  // interaction prompts
  G.prompt = null;
  if (!G.fight) {
    if (dist(h.x, h.y, HOME.door.x, HOME.door.y + 20) < 50) G.prompt = { text: 'Μπες στο σπίτι', act: () => goHouse() };
    else if (dist(h.x, h.y, DOCK.main.x, DOCK.main.y) < 48) G.prompt = { text: 'Βάρκα για το Νησάκι', act: () => boat(DOCK.island) };
    else if (dist(h.x, h.y, DOCK.island.x, DOCK.island.y) < 48) G.prompt = { text: 'Βάρκα για την πόλη', act: () => boat(DOCK.main) };
    else if (G.portal && dist(h.x, h.y, G.portal.x, G.portal.y) < 60) G.prompt = { text: 'Μπες στη μαγική πύλη', act: () => enterPortal() };
  }
  if (G.portal && !G.portal.found && dist(h.x, h.y, G.portal.x, G.portal.y) < 260) { G.portal.found = true; toast('Βρήκες τη μαγική πύλη!', '#ff9bf0'); sfx('portal'); }
}
function boat(to) { const h = G.hero; sfx('splash'); G.fade = { t: 0, dur: .7, mid: () => { h.x = to.x; h.y = to.y; } }; }
function interact() { if (G.mode === 'city' && G.prompt && !G.cine && !G.dead) G.prompt.act(); }
function enterPortal() {
  sfx('portal'); music(null);
  G.fade = { t: 0, dur: 1.4, mid: () => { G.S.finished = true; G.portal = null; saveGame(false); startEnding(); } };
}

function update(dt) {
  G.time += dt;
  G.toasts = G.toasts.filter(t => (t.t += dt) < t.dur);
  if (G.fade) { G.fade.t += dt; if (!G.fade.midDone && G.fade.t > G.fade.dur / 2) { G.fade.midDone = true; G.fade.mid(); } if (G.fade.t >= G.fade.dur) G.fade = null; }
  if (G.mode === 'ending') { G.end.t += dt; return; }
  if (G.mode !== 'city' || G.paused) return;
  updateSky(dt); G.comicCd -= dt;
  if (G.S) G.S.playMs += dt * 1000;
  G.fx = G.fx.filter(f => { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.kind === 'spark') f.vy += 300 * dt; return f.t < f.dur; });
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  if (G.cine) { G.cine.t += dt; if (G.cine.t >= G.cine.dur) { const d = G.cine.done; G.cine = null; d && d(); } return; }
  if (G.freeze > 0) { G.freeze -= dt; return; }
  G.shake = Math.max(0, G.shake - dt);
  updateHero(dt); updateFight(dt); updateProj(dt); updateLife(dt);
  G.saveTimer += dt; if (G.saveTimer > 20 && !G.fight) { G.saveTimer = 0; saveGame(false); }
}

/* ---------- ending ---------- */
function startEnding() {
  G.mode = 'ending'; G.end = { t: 0, shown: false };
  const R = seeded(G.S.seed);
  const fam = G.S.family;
  const mk = (gender, sc) => { const L = randomLook(R); if (gender === 'girl') { L.hair = pick2(R, ['long', 'bun', 'bob', 'curly']); L.bottom = 'skirt'; } if (gender === 'boy') { L.hair = pick2(R, ['short', 'buzz', 'curly']); L.bottom = 'pants'; } return { L, sc }; };
  G.end.people = [Object.assign(mk('girl', 1.12), { name: fam.mom, role: 'Μαμά' }), Object.assign(mk('boy', 1.18), { name: fam.dad, role: 'Μπαμπάς' })]
    .concat(fam.sibs.map(n => Object.assign(mk(R() < .5 ? 'girl' : 'boy', .86), { name: n, role: 'Αδερφάκι' })));
  G.end.hero = plainLook(G.S.look);
  setMode('ending'); music('end');
}

/* ============================================================
   Rendering (world, HUD, cinematics, ending)

const cv = document.getElementById('game'), ctx = cv.getContext('2d');

    bakes: Paint.bakes, bakeMs: Math.round(Paint.bakeMs), fallbacks: Paint.fallbacks, layers: Paint.layers, foreBuilds: Paint.foreBuilds, vigOn: Paint.vigOn },
});
function boot() {
  buildWorld(); heroInit(); spawnLife(); resize();
  showScreen('title');
  requestAnimationFrame(frame);
}
boot();
</script>
